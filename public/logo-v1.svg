<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- SomniaFlow Logomark V1: Ascending Pipeline Constellation -->
  <!-- Three nodes rising left→right represent pipeline stages: fetch → infer → act -->

  <!-- Connection: node1 → node2 (dim) -->
  <line x1="13" y1="33" x2="23" y2="23" stroke="#1a3548" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Connection: node2 → node3 (brand) -->
  <line x1="25" y1="21" x2="33.5" y2="13.5" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Node 1 — dim (data fetch stage) -->
  <circle cx="11" cy="35" r="4" fill="#0a1220" stroke="#1a3548" stroke-width="1.5"/>

  <!-- Node 2 — mid (AI inference stage) -->
  <circle cx="24" cy="22" r="4.5" fill="#0a1220" stroke="#7fa8b8" stroke-width="1.5"/>
  <circle cx="24" cy="22" r="1.5" fill="#7fa8b8" opacity="0.6"/>

  <!-- Node 3 — brand (action stage) -->
  <circle cx="37" cy="11" r="5.5" fill="#22d3ee" opacity="0.15"/>
  <circle cx="37" cy="11" r="4" fill="#22d3ee"/>
  <!-- glow ring -->
  <circle cx="37" cy="11" r="6.5" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.35"/>
</svg>
